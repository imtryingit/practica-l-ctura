{l:"A2",t:"Shopping for Shoes",x:"Paula needed new shoes for a wedding. She visited three stores, but the shoes were too expensive. Finally, she found a beautiful pair on sale. They were red and very comfortable. She paid only twenty dollars. She was so happy that she bought a bag too."},
{l:"A2",t:"The Missed Bus",x:"Ben woke up late on Wednesday. He quickly took a shower and ran to the bus stop, but the bus was already gone. He waited for twenty minutes in the cold. Then a friend stopped her car and gave him a ride. Ben arrived at work on time and thanked her."},
{l:"A2",t:"My First Day at Work",x:"On Monday I started my new job in a bank. I was nervous because I did not know anyone. My boss showed me my desk and introduced me to the team. They were friendly, and we had lunch together. At five I went home tired, but happy."},
{l:"B1",t:"The Language Exchange",x:"Sofia wanted to improve her English, so she joined a language exchange group. At first she was afraid of making mistakes. However, her partner, an American named Jake, was patient and kind. They met every Thursday in a café and talked about their lives. After three months, Sofia could speak with much more confidence."},
{l:"B1",t:"A Surprise Visit",x:"Last weekend I was cleaning my apartment when the doorbell rang. I opened the door and could not believe my eyes. It was my cousin Diego, who lives in Spain! He had decided to surprise the whole family. We had not seen each other for five years, so we hugged for a long time."},
{l:"B1",t:"The Broken Phone",x:"Lucas dropped his phone while he was crossing the street, and the screen broke into pieces. He felt terrible because all his photos were inside. A repair shop told him it would cost a lot of money. Fortunately, a friend explained that his pictures were saved online. Lucas learned to make backups."},
{l:"B1",t:"Learning to Cook",x:"Helen had never cooked before she moved away from home. Her first dinner was a disaster: the rice burned and the soup was too salty. She did not give up. She watched videos, bought a notebook and wrote down every recipe. A few months later, she invited her friends and cooked a delicious meal for everyone."},
{l:"B1",t:"The Marathon",x:"Pedro decided to run a marathon even though he had never been a sportsman. He trained six days a week, and he stopped eating junk food. The day of the race was hard, and his legs hurt after twenty kilometers. Still, he did not stop. When he crossed the finish line, he was exhausted but incredibly proud."},
{l:"B1",t:"A Strange Dream",x:"Last night I had a strange dream. I was flying over my city, and everything looked tiny. Suddenly, I saw my old school, and all my classmates were waving at me. I tried to land, but I could not. Then my alarm clock rang, and I woke up. I wonder what it means."},
{l:"B2",t:"The Remote Worker",x:"Since she started working from home, Clara had noticed that her productivity had increased, yet she felt increasingly isolated. She missed the casual conversations by the coffee machine and the sense of belonging to a team. Eventually, she began renting a desk in a shared office, which gave her the flexibility she wanted without the loneliness she dreaded."},
{l:"B2",t:"The Missing Painting",x:"When the museum opened on Monday, the guards discovered that the most valuable painting had disappeared. There were no broken windows and no signs of a forced entry, which puzzled the police. After reviewing the security footage, they noticed that a cleaner had been carrying an unusually large bag. The investigation had finally found its first lead."},
{l:"B2",t:"Second Chances",x:"Marta had failed her driving test three times, and she was beginning to believe she was simply not made for it. Her instructor, however, insisted that nerves were the only thing standing in her way. On her fourth attempt, she took a deep breath, ignored the examiner, and drove as if she were alone on the road. She passed with flying colors."},
{l:"B2",t:"The Old Bookshop",x:"Tucked away in a narrow alley, the old bookshop had survived for decades despite the rise of online stores. Its owner, a man who rarely spoke, seemed to know exactly which book each customer needed. People said that he could read a stranger within seconds. Whether it was true or not, nobody ever left empty-handed."},
{l:"B2",t:"A Difficult Conversation",x:"Ahmed had been avoiding the conversation for weeks. He knew that telling his best friend about his decision to move abroad would hurt her, but staying silent seemed even worse. When he finally spoke, she was quiet for a moment and then smiled sadly. “I always knew you would leave,” she admitted. “I just hoped it would be later.”"},
{l:"B2",t:"The Storm",x:"By the time the storm reached the village, most residents had already boarded up their windows and moved to higher ground. Those who ignored the warnings soon regretted it. The river overflowed, the power went out, and the streets turned into rivers. In the following days, neighbors worked together to rebuild what the water had destroyed."},
{l:"A1",t:"My Best Friend",x:"My best friend is Tom. He is tall and funny. He has brown hair and green eyes. We are in the same class. He likes music and I like sports. After school we play games. Tom is a good friend."},
{l:"A1",t:"The Weather",x:"Today is cold and windy. I wear a coat and a hat. My brother wears a scarf. It is winter in my city. In summer it is hot. In spring there are many flowers. I like all the seasons, but I love the summer."},

{l:"A2",t:"The Cooking Contest",x:"Last month Marco entered a cooking contest in his town. He prepared a chicken soup with fresh vegetables. The judges tasted it and smiled. Marco did not win first prize, but he came in second. He received a small trophy and many compliments. Next year he wants to try again."},
{l:"A2",t:"Lost in the City",x:"Anna visited Rome for the first time. She walked around all morning and soon she was lost. Her phone had no battery, so she asked a woman for help. The woman showed her the way to the hotel on a map. Anna thanked her and promised to learn Italian."},
{l:"A2",t:"A Day at the Zoo",x:"On Sunday we took the children to the zoo. They saw lions, monkeys and a giant elephant. The little girl was afraid of the snakes, but she loved the penguins. We had sandwiches for lunch near the lake. At four o clock everybody was tired, and the children fell asleep in the car."},
{l:"A2",t:"The Gym",x:"Kevin decided to go to the gym three times a week. At first it was difficult, and his muscles hurt a lot. He met a friendly trainer who gave him good advice. After two months he felt stronger and had more energy. Now he cannot imagine his week without exercise."},
{l:"A2",t:"A Rainy Wedding",x:"It rained all day on the wedding of Julia and Mark. The guests were worried, but the couple stayed calm. They moved the party into the big hall of the hotel. Everyone danced and laughed with wet shoes. It was not the wedding they planned, but they will always remember it."},
{l:"A2",t:"The Library",x:"Every Saturday Emma goes to the town library. She borrows two books and reads them during the week. Last Saturday she met an old friend there. They sat together, drank tea and talked about their favorite stories. Emma returned home with three books instead of two."},
{l:"A2",t:"The Lost Dog",x:"Our neighbor lost his dog on Friday. He put posters on the trees and asked everybody in the street. On Sunday a boy found the dog near the river. It was dirty and hungry, but it was fine. The neighbor cried with joy and gave the boy a big reward."},
{l:"B1",t:"The Job Interview",x:"Elena had been preparing for the interview all week. She practiced the answers in front of the mirror and chose her best suit. Still, when she sat in front of the manager, her hands started to shake. She took a breath and spoke slowly. Two days later, the company called to offer her the job."},
{l:"B1",t:"A Change of Plans",x:"We were going to spend the weekend in the mountains, but the weather forecast predicted heavy rain. At first we were disappointed. Then my sister suggested staying home and organizing a game night instead. We played cards, ordered pizza and laughed until late. It turned out to be better than the original plan."},
{l:"B1",t:"The Street Musician",x:"Every morning on my way to work I passed a street musician who played the violin. I never stopped because I was always in a hurry. One day I arrived early and decided to listen. His music was so beautiful that I forgot my worries. Since then, I leave home ten minutes earlier."},
{l:"B1",t:"Moving Abroad",x:"Isabel moved to Canada to study for her master degree. The first weeks were difficult because she missed her family and the food. She felt lonely until she joined a hiking club. There she made friends from all over the world. By the end of the year, she did not want to leave."},
{l:"B1",t:"The Neighbor Next Door",x:"Our neighbor was a grumpy old man who complained about everything. One winter, he slipped on the ice and broke his leg. My father offered to bring him groceries every week. Little by little, the man started to smile and even invited us for tea. We learned that people are often kinder than they seem."},
{l:"B1",t:"A Wrong Number",x:"Yesterday I received a message from an unknown number. It said, “Happy birthday, grandma!” I replied that it was a mistake, but the person insisted I was his grandmother. We exchanged messages for a while and laughed about the confusion. In the end, he sent me a photo of a cake and said it was for me."},
{l:"B1",t:"The Charity Run",x:"Our company organized a charity run to help sick children. Although I hate running, I signed up because my colleagues convinced me. I was the last person to arrive, but everybody cheered for me. We raised more than five thousand dollars. It was a tiring day, but it gave me a good feeling."},
{l:"B2",t:"The Whistleblower",x:"After months of hesitation, Rachel decided to report the illegal practices she had witnessed at her company. She knew that doing so could cost her career, and several colleagues warned her to keep quiet. Nevertheless, she felt that silence would make her complicit. The investigation that followed proved her right, although the personal price was higher than she had expected."},
{l:"B2",t:"A Lesson in Humility",x:"Having won every debate at university, Oliver assumed that his first presentation at work would be effortless. Instead, he was interrupted, challenged and corrected by people with decades of experience. Though humiliated at first, he gradually understood that listening was a skill he had neglected. His next presentation was shorter, humbler and far more convincing."},
{l:"B2",t:"The Abandoned House",x:"For as long as the villagers could remember, the house at the end of the road had stood empty. Rumors claimed that it was haunted, so children dared each other to approach it. When a young couple finally bought it, they discovered nothing more sinister than a leaking roof and a cellar full of old letters. These letters revealed a love story that nobody had suspected."},
{l:"B2",t:"The Price of Fame",x:"Lucía never imagined that a single video would change her life overnight. Within days, millions of strangers were commenting on everything she did, praising her one moment and criticizing her the next. Although the attention flattered her at first, she grew exhausted by the constant scrutiny. Eventually she deleted her account, preferring an ordinary life to a public one."},
{l:"B2",t:"Rebuilding Trust",x:"It took Miguel years to forgive his brother for the argument that had divided the family. Neither of them had been willing to apologize, each convinced the other should speak first. It was the illness of their mother that finally brought them together at the hospital. Standing side by side, they realized how trivial their pride had been."},
{l:"B2",t:"An Unlikely Friendship",x:"When the elderly widow moved in next door, the teenager assumed they would have nothing in common. However, an accidental conversation about old films revealed a shared passion. Over the following months, she taught him to appreciate classics, while he taught her to use a smartphone. Neither would have predicted how much they would come to rely on one another."},
{l:"B2",t:"The Deadline",x:"With only two hours left before the deadline, the team was still struggling to finish the report. Tensions were running high, and someone suggested submitting an incomplete version. Instead, Hannah proposed dividing the remaining work according to the strengths of each member. They delivered with five minutes to spare, exhausted yet proud."}

ng:empezando (start over = empezar de nuevo)|over:de nuevo|after:después de|weeks:semanas|doubt:duda|realized:se dio cuenta|staying:quedarse|comfortable:cómodo|being:ser / estar|accepted:aceptó|offer:oferta|convinced:convencido|regret:arrepentimiento|hurt:dolería (doler)|more:más|than:que|failure:fracaso|ana:(nombre propio)|max:(nombre propio)|tom:(nombre propio)|maria:(nombre propio)|daniel:(nombre propio)").split("|").forEach(function(e){var i=e.indexOf(":");D[e.slice(0,i)]=e.slice(i+1)});
